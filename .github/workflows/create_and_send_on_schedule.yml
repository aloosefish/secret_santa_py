on:
  workflow_dispatch:
  # schedule:
  #   #    "At 18:45 UTC (2:45pm CST) on October 26th."
  #   - cron: "45 19 26 10 *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-groups

      - name: Run cloud_run.py
        run: uv run python cloud_run.py ${{ secrets.JSON_DATA_URL }} ${{ secrets.JSON_DATA_KEY }} ${{ secrets.SENDGRIDKEY }} ${{ secrets.SENDGRID_EMAIL_SENDER }}
